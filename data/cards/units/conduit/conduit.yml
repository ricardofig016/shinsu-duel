type: unit
kind: conduit
name: Conduit
cost: 0
hp: 8
entryHp: 2
deckConstraints:
  - type: unreachable
    raw: "I am [[keyword:Unreachable]]"
passives:
  - type: give_condition
    condition: ghost
    target: { side: self }
    trigger: { type: round_start }
    raw: "[[trigger:Round Start]]: Give me [[condition:Ghost]]"
  - type: conditional
    triggers:
      - { type: round_start }
      - { type: activation }
    if:
      type: has_unit
      target:
        side: enemy
        attribute: jeonsulsa
      negate: true
    then:
      type: slay
      target: { side: self }
    raw: "[[trigger:Round Start]] or [[trigger:Activation]]: If there is no [[attribute:Jeonsulsa]] on the enemy team, [[keyword:Slay]] me"
  - type: play_jeonsul_baang
    triggers:
      - { type: round_start }
      - { type: activation }
    raw: "[[trigger:Round Start]] or [[trigger:Activation]]: For every 2 HP that I have, play 1 random [[series:Jeonsul Baang]] on a random ally"
abilities:
evolve:
traits:
attributes:
affiliations:
