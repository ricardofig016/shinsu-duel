type: equipment
name: Fourth Thorn Fragment
series: thorn-fragment
cost: 1
requirements:
deckConstraints:
  - type: unreachable
    raw: "i am Unreachable"
effects:
  - type: conditional
    quick: true
    trigger: { type: equip }
    if:
      type: has_all_equipped
      cardNames:
        - "First Thorn Fragment"
        - "Second Thorn Fragment"
        - "Third Thorn Fragment"
        - "Fourth Thorn Fragment"
    then:
      type: sequence
      steps:
        - type: discard
          card:
            type: equipment
            series: thorn-fragment
          owner: you
        - type: create_card
          card:
            name: "Enryu's Thorn"
    raw: "when the bearer is equipped with all 4 unique Thorn Fragment equipments, discard those 4 equipments and create Enryu's Thorn in your hand"
  - type: grant_trait
    trait: bloodthirsty
    amount: 1
    target: { side: bearer }
    raw: "the bearer has Bloodthirsty 1"
ignition: