type: equipment
name: Second Thorn Fragment
series: thorn-fragment
cost: 1
requirements:
deckConstraints:
  - type: unreachable
    raw: "I am [[keyword:Unreachable]]"
effects:
  - type: conditional
    quick: true
    trigger: { type: equip }
    if:
      type: has_all_equipped
      series: thorn-fragment
    then:
      type: sequence
      steps:
        - type: discard
          card:
            type: equipment
            series: thorn-fragment
            zone: attachments
          owner: you
        - type: create_card
          card:
            name: "Enryu's Thorn"
    raw: "When the [[rule:Bearer]] is equipped with all 4 unique [[series:Thorn Fragment]] equipments, [[keyword:Discard]] those 4 equipments and create [[card:Enryu's Thorn]] in your hand"
  - type: modify_stat
    stat: heal
    amount: 1
    target: { side: bearer }
    raw: "The [[rule:Bearer]]'s healing abilities heal +1 HP"
ignition: