<div class="card-vertical-frame">
  <div class="card-vertical container-vertical">
    <div class="card-vertical-title container-horizontal">
      <img class="card-vertical-type-letter" alt="" />
      <h1 class="card-vertical-name">Name</h1>
      <div class="card-vertical-header-icons container-horizontal"></div>
    </div>
    <div class="card-vertical-artwork-frame">
      <div class="card-vertical-artwork"></div>
      <div class="card-vertical-trapezoid card-vertical-rank-trapezoid">
        <span class="card-vertical-rank"></span>
      </div>
      <div class="card-vertical-trapezoid card-vertical-affiliations-trapezoid">
        <span class="card-vertical-affiliation"></span>
      </div>
      <div class="card-vertical-affiliations-tooltip-frame tooltip">
        <div class="card-vertical-affiliations-tooltip container-vertical"></div>
      </div>
    </div>
    <div class="card-vertical-strips container-horizontal">
      <div class="card-vertical-traits-frame">

        <div class="card-vertical-traits-tooltip-frame tooltip">
          <div class="card-vertical-traits-tooltip container-vertical"></div>
        </div>
      </div>
      <div class="card-vertical-conditions-frame">
        <div class="card-vertical-conditions container-horizontal"></div>
        <div class="card-vertical-conditions-tooltip-frame tooltip">
          <div class="card-vertical-conditions-tooltip container-vertical"></div>
        </div>
      </div>
    </div>
    <ul class="card-vertical-text"></ul>
    <div class="card-vertical-stats container-horizontal">
      <h1 class="card-vertical-shinsu">0</h1>
      <ul class="card-vertical-positions"></ul>
      <h1 class="card-vertical-hp">0</h1>
    </div>
  </div>
</div>
