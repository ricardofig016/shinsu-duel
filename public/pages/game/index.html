<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shinsu Duel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/global.css" />
    <link rel="stylesheet" href="/pages/game/styles.css" />
  </head>
  <body>
    <div id="game-container">
      <!-- opponent -->
      <div id="opponent-container" class="side-container container-horizontal">
        <div class="combat-slots-container container-vertical"></div>
        <div class="deck-lighthouse-container container-vertical">
          <div class="deck-outer-container">
            <div class="deck-container"></div>
          </div>
          <div class="lighthouse-container container-horizontal">
            <div class="lighthouse-token">
              <img src="/assets/images/lighthouses/red2.png" alt="lighthouse" />
              <h1>0</h1>
            </div>
          </div>
        </div>
        <div class="board-container">
          <div class="board-frame container-vertical">
            <div class="backline-container container-horizontal"></div>
            <div class="frontline-container container-horizontal"></div>
          </div>
        </div>
        <div class="hand-shinsu-pass-button-container container-vertical">
          <div class="hand-container container-horizontal"></div>
          <div class="shinsu-pass-button-container container-horizontal">
            <div class="shinsu-container container-horizontal">
              <div class="normal-shinsu container-vertical">
                <div class="normal-shinsu-row container-horizontal">
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                </div>
                <div class="normal-shinsu-row container-horizontal">
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                </div>
              </div>
              <div class="shinsu-separator"></div>
              <div class="recharged-shinsu container-vertical">
                <div class="shinsu-circle"></div>
                <div class="shinsu-circle"></div>
              </div>
            </div>
            <div class="pass-button-frame">
              <div class="pass-button-container"><h2>opponent</h2></div>
            </div>
          </div>
        </div>
      </div>
      <div id="round-divider">
        <hr />
        <div id="round-indicator" class="container-vertical">
          <h2 id="round-number">1</h2>
          <span id="round-label">Round</span>
        </div>
      </div>
      <!-- you -->
      <div id="you-container" class="side-container container-horizontal">
        <div class="combat-slots-container container-vertical"></div>
        <div class="deck-lighthouse-container container-vertical">
          <div class="lighthouse-container container-horizontal">
            <div class="lighthouse-token">
              <img src="/assets/images/lighthouses/blue2.png" alt="lighthouse" />
              <h1>0</h1>
            </div>
          </div>
          <div class="deck-outer-container">
            <div class="deck-container"></div>
          </div>
        </div>
        <div class="board-container">
          <div class="board-frame container-vertical">
            <div class="frontline-container container-horizontal"></div>
            <div class="backline-container container-horizontal"></div>
          </div>
        </div>
        <div class="hand-shinsu-pass-button-container container-vertical">
          <div class="shinsu-pass-button-container container-horizontal">
            <div class="shinsu-container container-horizontal">
              <div class="normal-shinsu container-vertical">
                <div class="normal-shinsu-row container-horizontal">
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                </div>
                <div class="normal-shinsu-row container-horizontal">
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                  <div class="shinsu-circle"></div>
                </div>
              </div>
              <div class="shinsu-separator"></div>
              <div class="recharged-shinsu container-vertical">
                <div class="shinsu-circle"></div>
                <div class="shinsu-circle"></div>
              </div>
            </div>
            <div id="fire-charge-container" class="hidden container-vertical">
              <h2 id="fire-charge-count">0</h2>
              <button id="fire-charge-generate" type="button">Generate</button>
            </div>
            <!-- this works as a button -->
            <div class="pass-button-frame">
              <div class="pass-button-container"><h2>you</h2></div>
            </div>
          </div>
          <div class="hand-container container-horizontal"></div>
        </div>
      </div>
    </div>

    <!-- position switch chooser -->
    <div id="position-chooser" class="hidden"></div>

    <!-- pending decision prompt -->
    <div id="decision-prompt" class="hidden">
      <div class="decision-prompt-panel container-vertical">
        <h2 id="decision-prompt-title">Choose</h2>
        <p id="decision-prompt-hint"></p>
        <div id="decision-prompt-candidates" class="container-horizontal"></div>
        <button id="decision-prompt-confirm" type="button">Confirm</button>
      </div>
    </div>

    <!-- hand peek reveal -->
    <div id="peek-overlay" class="overlay hidden">
      <div class="overlay-panel container-vertical">
        <h2>Revealed hand</h2>
        <ul id="peek-overlay-cards" class="allow-scroll"></ul>
      </div>
    </div>

    <!-- waiting for the opponent -->
    <div id="waiting-overlay" class="overlay hidden">
      <div class="overlay-panel container-vertical">
        <h2>Waiting</h2>
        <p id="waiting-overlay-message"></p>
      </div>
    </div>

    <!-- game over -->
    <div id="game-over-overlay" class="overlay hidden">
      <div class="overlay-panel container-vertical">
        <h1 id="game-over-headline">Game over</h1>
        <p id="game-over-detail"></p>
      </div>
    </div>

    <!-- skill drop veil: covers the whole opponent side while dragging a skill -->
    <div id="skill-drop-overlay" class="hidden"></div>

    <!-- socket.io client library -->
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/pages/game/script.js"></script>
  </body>
</html>
